name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please do not paste private note content. Security problems go through SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DeskNotes version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and desktop
      placeholder: Ubuntu 24.04, GNOME, Wayland
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Was any note content lost?
      options: ["No", "Yes", "Not sure"]
    validations:
      required: true
