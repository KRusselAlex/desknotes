name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
# The Rust version comes from rust-toolchain.toml and Node from .nvmrc, so CI
# builds with exactly what developers use.

jobs:
  core:
    name: Core (Rust, no GUI libraries)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p desknotes-core --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p desknotes-core

  frontend:
    name: Frontend (TypeScript, React)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  app:
    name: Desktop app (Linux build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Clippy (whole workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Desktop app tests
        run: cargo test -p desknotes
      - name: Build desktop app
        run: cargo build -p desknotes
