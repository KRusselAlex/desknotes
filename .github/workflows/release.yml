name: Release

# Builds the Linux package when a version tag is pushed (for example v0.2.0) and
# attaches it to a DRAFT GitHub release. Nothing is published until a maintainer
# reviews the draft and clicks "Publish release".
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  linux:
    name: Build .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"; exit 1
          fi

      - name: System packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci

      - name: Tests
        run: |
          npm test
          cargo test --workspace

      - name: Build package
        run: npm run tauri build -- --bundles deb

      - name: Draft release with the package and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/release/bundle/deb
          sha256sum *.deb > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.deb SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "DeskNotes $GITHUB_REF_NAME" --generate-notes
