name: Packages

# Builds the Linux packages (.deb and AppImage).
# - On pull requests that change packaging: build and keep the files as workflow
#   artifacts, so packages can be tested before a release.
# - On a version tag (for example v0.2.0): build and attach the files to a DRAFT
#   GitHub release. Nothing is published until a maintainer clicks "Publish release".
on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/icons/**"
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build .deb and AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"; exit 1
          fi

      - name: System packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci

      - name: Tests
        run: |
          npm test
          cargo test --workspace

      # The AppImage tool (linuxdeploy) is downloaded by the Tauri bundler on this
      # runner. APPIMAGE_EXTRACT_AND_RUN avoids needing FUSE on the runner; NO_STRIP
      # avoids linuxdeploy's old strip failing on Ubuntu 24.04 libraries.
      - name: Build packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: npm run tauri build -- --bundles deb,appimage

      - name: Collect files and checksums
        run: |
          mkdir dist-packages
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist-packages/
          cd dist-packages && sha256sum * > SHA256SUMS && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: desknotes-linux-packages
          path: dist-packages/
          retention-days: 14

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desknotes-linux-packages
          path: dist-packages
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-packages/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "DeskNotes $GITHUB_REF_NAME" --generate-notes
