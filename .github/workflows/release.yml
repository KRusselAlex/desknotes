name: Packages

# Builds the Linux packages (.deb and AppImage).
# - On pull requests that change packaging: build and keep the files as workflow
#   artifacts, so packages can be tested before a release.
# - On a version tag: build and attach the files to a DRAFT GitHub release. Nothing is
#   published until a maintainer clicks "Publish release". Nothing here ever deletes,
#   edits or overwrites a release.
#     vX.Y.Z         a normal draft
#     vX.Y.Z-beta.N  a draft marked "pre-release" (any other tag form is refused)
#   A tag is refused unless it matches the version in tauri.conf.json exactly, its commit
#   is on main, and CHANGELOG.md has a section for the version with a "Database:" line.
#   That section becomes the release body. The tests and checks below must pass first.
#   The checks live in scripts/release/ (tested by scripts/release/test.sh).
on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/icons/**"
      - "scripts/release/**"
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build .deb and AppImage
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # Full history: the on-main check needs it (a shallow clone cannot answer).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the release tag
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          scripts/release/check-tag.sh "$GITHUB_REF_NAME" src-tauri/tauri.conf.json origin/main | tee -a "$GITHUB_OUTPUT"

      - name: CHANGELOG must have a section for this version
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/release/changelog-section.sh "${GITHUB_REF_NAME#v}" CHANGELOG.md > /dev/null

      - name: System packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci

      # The full gate: the same checks as a pull request, before anything is built.
      - name: Release scripts tests
        run: bash scripts/release/test.sh
      - name: Frontend lint, types and tests
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Rust format, clippy and tests
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # The AppImage tool (linuxdeploy) is downloaded by the Tauri bundler on this
      # runner. APPIMAGE_EXTRACT_AND_RUN avoids needing FUSE on the runner; NO_STRIP
      # avoids linuxdeploy's old strip failing on Ubuntu 24.04 libraries.
      - name: Build packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: npm run tauri build -- --bundles deb,appimage

      - name: Collect files and checksums
        run: |
          mkdir dist-packages
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist-packages/
          cd dist-packages && sha256sum * > SHA256SUMS && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: desknotes-linux-packages
          path: dist-packages/
          retention-days: 14

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance statement
      attestations: write # store it
    steps:
      # The checkout is only for CHANGELOG.md and scripts/release/.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desknotes-linux-packages
          path: dist-packages

      - name: Release notes from CHANGELOG.md
        run: scripts/release/changelog-section.sh "${GITHUB_REF_NAME#v}" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      # Provenance: a signed statement that these exact files were built by this workflow
      # from this commit. Verify a download with: gh attestation verify FILE --repo OWNER/REPO
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-packages/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist-packages/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag "${flags[@]}" \
            --title "DeskNotes $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
