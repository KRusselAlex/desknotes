[workspace]
resolver = "3"
members = ["crates/desknotes-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/KRusselAlex/desknotes"
rust-version = "1.90"

[workspace.dependencies]
desknotes-core = { path = "crates/desknotes-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
