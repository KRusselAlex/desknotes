[workspace]
resolver = "3"
members = ["crates/desknotes-core", "src-tauri"]

[workspace.package]
version = "0.3.0-beta.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/KRusselAlex/desknotes"
rust-version = "1.90"

[workspace.dependencies]
desknotes-core = { path = "crates/desknotes-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

# Argon2 (PIN and recovery-code hashing) is about eight times slower unoptimized
# (measured 2026-11-08), which made debug builds and tests wait seconds per hash.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
