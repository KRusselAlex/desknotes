[package]
name = "desknotes-core"
description = "Platform-independent core of DeskNotes: models, validation and SQLite persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
image.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
argon2 = "0.6.0"
# Animated GIFs are copied frame by frame in indexed form (already pulled in by `image`).
gif = { version = "0.14.2", default-features = false, features = ["std"] }
# Images travel inside the backup file as base64 text.
base64 = "0.22"
# Reminder time rules (local wall clock, DST). `clock` gives `Local` to the shell.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
# IANA zones (Europe/Paris, America/New_York) for the reminder DST tests only.
chrono-tz = "=0.10.4"
